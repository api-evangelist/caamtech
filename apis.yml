  name: CaaMTech WordPress REST API
  description: 'The public WordPress REST API served by caam.tech at /wp-json/. This
    is not a CaaMTech product API — it is the content API of the company web site,
    exposed publicly by WordPress core and its plugins. Anonymous reads return the
    company''s published research updates, pages, categories, tags, media and site
    metadata as JSON; write operations and the MCP adapter require WordPress
    Application Password or cookie authentication.'
