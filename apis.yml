aid: caamtech
name: CaaMTech
description: 'CaaMTech is a pharmaceutical drug discovery company in Issaquah, Washington,
  founded by Dr. Andrew Chadeayne, engineering next-generation psychedelic-inspired
  small-molecule therapeutics for mental health conditions. It synthesizes and characterizes
  novel tryptamines, screens natural and synthetic compounds for safety and efficacy,
  publishes fundamental crystallographic and pharmacological research, and builds a
  patent portfolio around the results. CaaMTech operates no developer program and
  publishes no product API; the only machine-readable surface on caam.tech is the
  standard WordPress REST API that serves the company site, which does make its research
  updates, pages and media programmatically readable without credentials, alongside an
  authenticated WordPress MCP adapter endpoint.'
